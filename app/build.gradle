apply plugin: 'com.android.application'

android {
    namespace 'com.easemob.sdktest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.easemob.sdktest'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters.addAll((findProperty('testAbis') ?: 'arm64-v8a x86_64').split(' ')) }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { implementation project(':hyphenatechatsdk') }
